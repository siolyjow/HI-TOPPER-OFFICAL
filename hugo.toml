baseURL = "https://www.hitopper.top/"
languageCode = "zh-cn"
title = "HI-TOPPER"
theme = "PaperMod"
disableHugoGeneratorInject = true
enableRobotsTXT = true

[params]
  # Keep production pages indexable even if the deployment environment does
  # not set Hugo's production flag explicitly.
  env = "production"
  author = "HI-TOPPER"
  description = "心と体を温めるアーティスト"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowShareButtons = false
  disableSpecial1stPost = true
  footerCopyright = "© 2025 HI-TOPPER"

[params.assets]
  favicon = "/favicon.ico"
  favicon16x16 = "/favicon-16x16.png"
  favicon32x32 = "/favicon-32x32.png"
  apple_touch_icon = "/apple-touch-icon.png"

