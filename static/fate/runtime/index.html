function confetti(){const cs=['#ffe08e','#fff','#b9e8ff','#f6f4ff'];for(let i=0;i<60;i++){const c=document.createElement('i');c.className='c';c.style.left=(Math.random()*100)+'vw';c.style.color=cs[i%4];c.style.animationDuration=(2+Math.random()*2)+'s';c.style.animationDelay=(Math.random()*.5)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),5000)}}
function applyWordGlow(vals){strips.forEach((x,idx)=>{x.r.classList.remove('yes','no');x.r.classList.add(vals[idx].toLowerCase())})}
function spinTo(target){return new Promise(done=>{const tense=target[0]==='YES'&&target[1]==='YES';const t0=performance.now();const dur=[1.9,2.7,tense?5.1:3.7];const stopBase=[14,17,tense?22:20];const finalIndices=target.map((w,i)=>{const want=w==='YES'?0:1;return stopBase[i]%2===want?stopBase[i]:stopBase[i]+1});applyWordGlow(['NO','NO','NO']);(function tick(now){const t=(now-t0)/1000;let all=true;for(let i=0;i<3;i++){const H=reelHeight(i),u=Math.min(t/dur[i],1),e=1-(1-u)**3.3,pos=(finalIndices[i]*H)*e,v=(finalIndices[i]*H)*(3.3)*(1-u)**2.3/dur[i];setPos(i,pos,Math.min(3.5,v/150));if(u<1)all=false}document.body.classList.toggle('tense',tense&&t>dur[1]&&t<dur[2]);if(all){document.body.classList.remove('tense');applyWordGlow(target);done()}else requestAnimationFrame(tick)})(t0)})}
function showResult(res){const ok=res.reels.length===3&&res.reels.every(v=>v==='YES');$('result').innerHTML='';const a=document.createElement('div');a.className='msg';a.textContent=ok?T().go:T().wait;$('result').append(a);if(ok)confetti();else setTimeout(()=>{$('form').classList.add('shake');setTimeout(()=>$('form').classList.remove('shake'),340)},220)}

function deliveryMessage(text){$('result').textContent=text}
function showDeliveredCode(key,durationDays){deliveryState.licenseKey=key;deliveryState.durationDays=durationDays;if(!st.premium)$('key').value=key;render();if(st.premium){$('deliverymessage').textContent=T().deliveryOther;deliveryMessage(T().deliveryOther)}else{deliveryMessage(Number(durationDays)===30?T().deliverySuccess30:T().deliverySuccess)}}
async function deliverToken(token){if(!token)return;if(!DELIVERY_TOKEN_RE.test(token)){deliveryMessage(T().deliveryInvalid);return}try{const r=await fateFetch('/api/delivery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});let data={};try{data=await r.json()}catch{}if(!r.ok){if(r.status>=500||r.status===429)saveDeliveryRetryToken(token);deliveryMessage(T().deliveryError);return}const key=data&&data.license_key;if(!DELIVERY_KEY_RE.test(key)){deliveryMessage(T().deliveryInvalid);return}clearDeliveryRetryToken();showDeliveredCode(key,data.duration_days)}catch{saveDeliveryRetryToken(token);deliveryMessage(T().deliveryRetry)}}

// ----- Music -----
let audioCtx=null,master=null,musicOn=false,ambientTimer=null;
function startMusic(){if(musicOn)return;musicOn=true;$('musicbtn').classList.add('on');if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();master=audioCtx.createGain();master.gain.value=.16;master.connect(audioCtx.destination)}if(audioCtx.state==='suspended')audioCtx.resume();const chords=[[110,164.81,220],[98,146.83,196],[123.47,185,246.94],[82.41,123.47,164.81]];let step=0;const play=()=>{if(!musicOn)return;const now=audioCtx.currentTime,chord=chords[step++%chords.length];chord.forEach((freq,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();o.type=i===0?'sine':'triangle';o.frequency.value=freq;f.type='lowpass';f.frequency.value=1200;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(i===0?.18:.09,now+1.2);g.gain.exponentialRampToValueAtTime(.0001,now+5.6);o.connect(f);f.connect(g);g.connect(master);o.start(now);o.stop(now+5.8)});const bell=audioCtx.createOscillator(),bg=audioCtx.createGain();bell.type='sine';bell.frequency.value=[659.25,783.99,987.77,1174.66][Math.floor(Math.random()*4)];bg.gain.setValueAtTime(.0001,now+.3);bg.gain.exponentialRampToValueAtTime(.12,now+.38);bg.gain.exponentialRampToValueAtTime(.0001,now+1.7);bell.connect(bg);bg.connect(master);bell.start(now+.3);bell.stop(now+1.8)};play();ambientTimer=setInterval(play,4200)}
function stopMusic(){musicOn=false;$('musicbtn').classList.remove('on');if(ambientTimer){clearInterval(ambientTimer);ambientTimer=null}}
$('musicbtn').onclick=()=>musicOn?stopMusic():startMusic();

// ----- Device key storage (private key never leaves this browser) -----
const DB_NAME='fate-device-v1', STORE='keys';
function openKeyDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function idbGet(k){const db=await openKeyDb();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly'),r=tx.objectStore(STORE).get(k);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function idbSet(k,v){const db=await openKeyDb();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(v,k);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
async function ensureKeyPair(){let privateKey=await idbGet('privateKey'),publicJwk=await idbGet('publicJwk');if(privateKey&&publicJwk)return{privateKey,publicJwk};const pair=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);publicJwk=await crypto.subtle.exportKey('jwk',pair.publicKey);const privateJwk=await crypto.subtle.exportKey('jwk',pair.privateKey);privateKey=await crypto.subtle.importKey('jwk',privateJwk,{name:'ECDSA',namedCurve:'P-256'},false,['sign']);await idbSet('privateKey',privateKey);await idbSet('publicJwk',publicJwk);return{privateKey,publicJwk}}
function bytesToB64url(bytes){let s='';for(const b of new Uint8Array(bytes))s+=String.fromCharCode(b);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/g,'')}
async function signText(privateKey,text){const sig=await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},privateKey,new TextEncoder().encode(text));return bytesToB64url(sig)}
function installId(){let id=localStorage.getItem('fate_install_id');if(!id){id=crypto.randomUUID();localStorage.setItem('fate_install_id',id)}return id}
async function signedProof(purpose){const deviceId=localStorage.getItem('fate_device_id');const privateKey=await idbGet('privateKey');if(!deviceId||!privateKey)return null;const cr=await fateFetch('/api/auth/challenge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_id:deviceId,purpose})});if(!cr.ok)return null;const c=await cr.json();return{device_id:deviceId,challenge_id:c.challenge_id,signature:await signText(privateKey,c.challenge)}}
async function refreshStatus(){let payload={};try{const proof=await signedProof('status');if(proof)payload=proof}catch{}const r=await fateFetch('/api/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw new Error('status');st=await r.json();render()}

async function activate(){const key=$('key').value.trim();if(!key){$('result').textContent=T().bad;return}try{const kp=await ensureKeyPair();const r=await fateFetch('/api/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({license_key:key,install_id:installId(),public_jwk:kp.publicJwk})});const data=await r.json();if(!r.ok){if(data.error==='license_already_bound')$('result').textContent=T().bound;else if(data.error==='key_already_registered')$('result').textContent=T().alreadyRegistered;else if(data.error==='activation_locked')$('result').textContent=T().locked;else if(data.error==='license_expired')$('result').textContent=T().expired;else if(data.error==='bad_key'||data.error==='license_not_found'||data.error==='invalid_license')$('result').textContent=T().bad;else $('result').textContent=T().activationError;return}localStorage.setItem('fate_device_id',data.device_id);deliveryState.licenseKey=null;deliveryState.durationDays=null;$('key').value='';$('keybox').hidden=true;$('deliverybox').hidden=true;$('result').textContent='';await refreshStatus()}catch{$('result').textContent=T().net}}

async function draw(){if(busy)return;const q=$('q').value.trim();if(!q){$('q').focus();$('result').textContent=T().empty;return}if(!musicOn)startMusic();busy=true;render();$('result').textContent=T().judging;try{let payload={question:q};if(st.premium){const proof=await signedProof('draw');if(!proof)throw{userMessage:T().auth};payload={...payload,...proof}}const r=await fateFetch('/api/draw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok){if(data.error==='used_today')throw{userMessage:T().used};throw{userMessage:T().net}}await spinTo(data.reels);showResult(data)}catch(e){$('result').textContent=e?.userMessage||T().net}busy=false;await refreshStatus().catch(()=>render())}

$('go').onclick=draw;$('q').onkeydown=e=>{if(e.key==='Enter')draw()};
$('keybtn').onclick=()=>{const show=$('keybox').hidden;$('keybox').hidden=!show;if(show)$('key').focus()};
$('redeem').onclick=activate;
$('deliverycopy').onclick=async()=>{const key=$('deliverycode').value;if(!key)return;try{await navigator.clipboard.writeText(key)}catch{const input=$('deliverycode');input.focus();input.select();try{document.execCommand('copy')}catch{}}$('deliverymessage').textContent=T().deliveryCopied};
$('langbtn').onclick=()=>{$('langmenu').hidden=!$('langmenu').hidden};
$('langmenu').querySelectorAll('button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem('fate_lang',lang)}catch{};$('langbtn').textContent=lang==='zh'?'中文':lang==='ja'?'日本語':lang==='ko'?'한국어':'EN';$('langmenu').hidden=true;$('result').textContent='';render()});
$('langbtn').textContent=lang==='zh'?'中文':lang==='ja'?'日本語':lang==='ko'?'한국어':'EN';
document.addEventListener('click',e=>{if(!e.target.closest('.langwrap'))$('langmenu').hidden=true});
render();refreshStatus().catch(()=>render());if(deliveryStartupToken)deliverToken(deliveryStartupToken);
</script></body></html>
