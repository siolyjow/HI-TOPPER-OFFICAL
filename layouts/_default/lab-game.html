{{ define "main" }}
<section class="lab-zone lab-game" data-slug="{{ .Params.slug }}"><nav class="lab-game-nav"><a href="/lab/">← 成功研究所へ戻る</a><span>ゲーム放題</span></nav><h1>{{ strings.TrimSuffix " | 成功研究所" .Title }}</h1><p id="lab-game-status" role="status" aria-live="polite">端末認証を確認しています…</p><div class="lab-game-player" id="lab-game-player" hidden><iframe id="lab-game-frame" allow="autoplay; clipboard-write; fullscreen" title="{{ .Title }}" loading="eager"></iframe><p><a id="lab-fullscreen" href="/lab/{{ .Params.slug }}/runtime/" target="_blank" rel="noopener">全画面で開く</a></p></div><div id="lab-game-buy" hidden><p>5つのゲームを遊ぶには、成功研究所の共通認証が必要です。</p><a href="/lab/">認証する・ゲーム放題を購入する</a></div></section>
<link rel="stylesheet" href="/lab/lab.css"><script src="/lab/device.js"></script><script>
(()=>{'use strict';const slug={{ .Params.slug | jsonify | safeJS }};const target='/lab/'+slug+'/runtime/';const frame=document.getElementById('lab-game-frame'),panel=document.getElementById('lab-game-player'),buy=document.getElementById('lab-game-buy'),status=document.getElementById('lab-game-status');
 if(location.hash.startsWith('#delivery=')){location.replace('/lab/'+location.search+location.hash);return}
 let checking=false;
 async function check(){if(checking)return;checking=true;try{const session=await LabAuth.session();if(!session)throw Error('no-license');const text=typeof session.expires_at==='number'&&Number.isFinite(session.expires_at)&&session.expires_at>0?new Date(session.expires_at*1000).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}):'';status.textContent='認証済み'+(text?'　有効期限：'+text:'');buy.hidden=true;panel.hidden=false;if(!frame.src)frame.src=target;}catch{status.textContent='未認証、または認証の有効期限が切れています。';panel.hidden=true;frame.removeAttribute('src');buy.hidden=false}finally{checking=false}}
 let tick=null;const startTimer=()=>{if(tick===null)tick=setInterval(check,60000)};const stopTimer=()=>{if(tick!==null){clearInterval(tick);tick=null}};check();startTimer();document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});window.addEventListener('pageshow',()=>{startTimer();check()});window.addEventListener('pagehide',stopTimer);
})();
</script>
{{ end }}
