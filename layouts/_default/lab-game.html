{{ define "main" }}
<section class="lab-zone lab-game" data-slug="{{ .Params.slug }}"><nav class="lab-game-nav"><a href="/lab/">← 成功研究所へ戻る</a><span>ゲーム放題</span></nav><h1>{{ strings.TrimSuffix " | 成功研究所" .Title }}</h1><p id="lab-game-status" role="status" aria-live="polite">無料プレイを確認しています…</p><div class="lab-game-player" id="lab-game-player" hidden><iframe id="lab-game-frame" data-lab-frame="true" scrolling="no" allow="autoplay; clipboard-write; fullscreen" title="{{ .Title }}" loading="eager"></iframe><p><a id="lab-fullscreen" href="/lab/{{ .Params.slug }}/runtime/" target="_blank" rel="noopener">全画面で開く</a></p></div><div id="lab-game-buy" hidden><p class="lab-game-buy-note">本日の無料分は利用済みです。次回は日本時間0時から、もう一度無料で遊べます。</p><a href="/lab/">100円で30日間遊び放題 ／ 認証コードを入力する</a></div></section>
<link rel="stylesheet" href="/lab/lab.css"><script src="/lab/device.js"></script><script src="/lab/frame-layout.js"></script><script>
(()=>{'use strict';const slug={{ .Params.slug | jsonify | safeJS }};const target='/lab/'+slug+'/runtime/';const frame=document.getElementById('lab-game-frame'),panel=document.getElementById('lab-game-player'),buy=document.getElementById('lab-game-buy'),status=document.getElementById('lab-game-status');
 if(location.hash.startsWith('#delivery=')){location.replace('/lab/'+location.search+location.hash);return}
 let checking=false;
 async function openTrial(){if(frame.getAttribute("src")){const active=await LabAuth.trialStatus(slug);if(active&&active.ok)return active}return LabAuth.trial(slug)}
 async function check(){if(checking)return;checking=true;try{let session=null;try{session=await LabAuth.session()}catch{}if(session){const text=typeof session.expires_at==='number'&&Number.isFinite(session.expires_at)&&session.expires_at>0?new Date(session.expires_at*1000).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}):'';status.textContent='認証済み'+(text?'　有効期限：'+text:'');buy.hidden=true;panel.hidden=false;if(!frame.src)frame.src=target;return}
   const trial=await openTrial();if(!trial||!trial.ok){const used=trial&&trial.error==='used_today';status.textContent=used?'本日の無料分は利用済みです。次回は日本時間0時から遊べます。':'無料プレイを開始できません。しばらくしてからお試しください。';buy.querySelector('.lab-game-buy-note').textContent=used?'本日の無料分は利用済みです。次回は日本時間0時から、もう一度無料で遊べます。':'無料プレイの確認ができません。通信状況をご確認ください。';panel.hidden=true;frame.removeAttribute('src');buy.hidden=false;return}
   status.textContent='本日の無料プレイ（1日1回）';buy.hidden=true;panel.hidden=false;if(!frame.src)frame.src=target;
  }catch{status.textContent='通信エラーです。しばらくしてからお試しください。';panel.hidden=true;frame.removeAttribute('src');buy.hidden=false}finally{checking=false}}
 let tick=null;const startTimer=()=>{if(tick===null)tick=setInterval(check,60000)};const stopTimer=()=>{if(tick!==null){clearInterval(tick);tick=null}};check();startTimer();document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});window.addEventListener('pageshow',()=>{startTimer();check()});window.addEventListener('pagehide',stopTimer);
})();
</script>
{{ end }}
